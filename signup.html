<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Registry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">🇷🇼 Registry</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="form-container">
    <h2>Sign Up</h2>
    <form id="signupForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" required placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="********">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm" required placeholder="********">
      </div>
      <button type="submit" class="btn-primary full">Sign Up</button>
      <p class="form-footer">Have an account? <a href="login.html">Login</a></p>
    </form>
    <p id="errorMsg" class="error"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
